<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lua File Viewer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d1117;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.upload {
    display: block;
    background: #161b22;
    border: 2px dashed #3b82f6;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    margin: 20px 0;
}

.upload:hover {
    background: #1c2330;
}

input {
    display: none;
}

#fileName {
    text-align: center;
    color: #60a5fa;
    margin: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.info {
    background: #161b22;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.code-box {
    direction: ltr;
    text-align: left;
    background: #010409;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 18px;
    overflow: auto;
    max-height: 70vh;
    white-space: pre;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.6;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>📂 Lua File Viewer</h1>

    <label class="upload" for="fileInput">
        📁
        <br><br>
        اضغط هنا لاختيار ملف Lua
        <br>
        <small>اختر ملف .lua</small>
    </label>

    <input id="fileInput" type="file" accept=".lua">

    <div id="fileName"></div>

    <button id="openBtn" disabled>
        🔓 فتح الملف
    </button>

    <div id="viewer" class="hidden">

        <div class="info">
            📄 اسم الملف:
            <strong id="name"></strong>
        </div>

        <div class="info">
            📊 حجم الملف:
            <strong id="size"></strong>
        </div>

        <div class="info">
            📝 عدد الأسطر:
            <strong id="lines"></strong>
        </div>

        <h3>📜 محتوى الملف:</h3>

        <pre id="code" class="code-box"></pre>

    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const openBtn = document.getElementById("openBtn");

const fileName = document.getElementById("fileName");
const viewer = document.getElementById("viewer");

const nameBox = document.getElementById("name");
const sizeBox = document.getElementById("size");
const linesBox = document.getElementById("lines");
const codeBox = document.getElementById("code");

let selectedFile = null;

fileInput.addEventListener("change", function () {

    selectedFile = this.files[0];

    if (!selectedFile) {
        openBtn.disabled = true;
        return;
    }

    if (!selectedFile.name.toLowerCase().endsWith(".lua")) {

        alert("❌ لازم تختار ملف بصيغة .lua");

        this.value = "";
        openBtn.disabled = true;
        return;
    }

    fileName.textContent = "📄 " + selectedFile.name;

    openBtn.disabled = false;
});


openBtn.addEventListener("click", function () {

    if (!selectedFile) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        const content = event.target.result;

        nameBox.textContent = selectedFile.name;

        sizeBox.textContent =
            (selectedFile.size / 1024).toFixed(2) + " KB";

        linesBox.textContent =
            content.split(/\r\n|\r|\n/).length;

        codeBox.textContent = content;

        viewer.classList.remove("hidden");
    };

    reader.onerror = function () {
        alert("❌ حدث خطأ أثناء فتح الملف.");
    };

    reader.readAsText(selectedFile);

});

</script>

</body>
</html>
