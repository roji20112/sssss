<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wlanapp</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 50px;
}

/* اللوجو */
.logo {
  width: 180px;
  margin-bottom: 20px;
}

/* فورم */
input, button {
  padding: 10px;
  margin: 10px;
  width: 300px;
}

/* صورة عائمة خارج التصميم */
.floating-img {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 100px;
  opacity: 0.9;
  z-index: 9999;
}
</style>

</head>
<body>

<!-- لوجو فوق الموقع -->
<img src="IMG_6141.png" class="logo">

<h2>fh_wlanapp</h2>

<input type="text" id="inputText" placeholder="fh12345">
<br>
<button onclick="transform()">تحويل</button>

<h3 id="output"></h3>

<!-- صورة خارج الموقع (زاوية الشاشة) -->
<img src="IMG_6141.png" class="floating-img">

<script>
// قواعد التحويل
const rules = {
  "1": "e",
  "9": "6",
  "4": "b",
  "2": "d",
  "7": "8",
  "8": "7"
};

function transformText(text) {
  if (text.startsWith("fh")) {
    text = text.substring(2);
  }

  let result = "";

  for (let ch of text) {
    result += rules[ch] || ch;
  }

  return "wlan" + result;
}

function transform() {
  let input = document.getElementById("inputText").value;
  let output = transformText(input);
  document.getElementById("output").innerText = output;
}
</script>

</body>
</html>
