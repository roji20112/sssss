<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Runner</title>

<script src="https://unpkg.com/fengari-web/dist/fengari-web.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0d1117;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.upload {
    display: block;
    padding: 35px 20px;
    text-align: center;
    border: 2px dashed #3b82f6;
    border-radius: 16px;
    background: #161b22;
    cursor: pointer;
    margin: 25px 0;
}

.upload:hover {
    background: #1c2330;
}

input {
    display: none;
}

.file {
    text-align: center;
    color: #60a5fa;
    margin: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #1d4ed8;
}

.box {
    background: #010409;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
}

pre {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    overflow: auto;
    max-height: 400px;
    font-family: monospace;
    line-height: 1.5;
}

.title {
    font-weight: bold;
    margin-bottom: 10px;
    color: #60a5fa;
}

#error {
    color: #ff6b6b;
}

#output {
    color: #7ee787;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 Lua Runner</h1>

<label class="upload" for="fileInput">
    📂
    <br><br>
    اضغط هنا لاختيار ملف Lua
    <br><br>
    <small>سيتم تشغيل محتوى الملف تلقائيًا</small>
</label>

<input type="file" id="fileInput" accept=".lua">

<div class="file" id="fileName"></div>

<button id="runBtn" disabled>
    ▶️ تشغيل Lua
</button>

<div class="box">
    <div class="title">📜 محتوى الملف</div>
    <pre id="code">لم يتم اختيار ملف بعد.</pre>
</div>

<div class="box">
    <div class="title">🖥️ Output</div>
    <pre id="output">لا يوجد Output.</pre>
</div>

<div class="box">
    <div class="title">❌ الأخطاء</div>
    <pre id="error"></pre>
</div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const runBtn = document.getElementById("runBtn");

const fileName = document.getElementById("fileName");
const codeBox = document.getElementById("code");
const outputBox = document.getElementById("output");
const errorBox = document.getElementById("error");

let selectedFile = null;
let luaCode = "";

fileInput.addEventListener("change", async function () {

    selectedFile = this.files[0];

    if (!selectedFile) {
        runBtn.disabled = true;
        return;
    }

    if (!selectedFile.name.toLowerCase().endsWith(".lua")) {

        alert("❌ لازم تختار ملف .lua");

        fileInput.value = "";
        runBtn.disabled = true;
        return;
    }

    fileName.textContent = "📄 " + selectedFile.name;

    luaCode = await selectedFile.text();

    codeBox.textContent = luaCode;

    outputBox.textContent = "";
    errorBox.textContent = "";

    runBtn.disabled = false;

    // تشغيل تلقائي
    runLua();
});


runBtn.addEventListener("click", runLua);


function runLua() {

    if (!luaCode) return;

    outputBox.textContent = "";
    errorBox.textContent = "";

    try {

        /*
         * Lua code is executed by Fengari
         * inside the browser.
         */

        const script = document.createElement("script");

        script.type = "application/lua";

        script.textContent = luaCode;

        script.addEventListener("error", function (event) {

            errorBox.textContent =
                "❌ حدث خطأ أثناء تشغيل Lua.";

        });

        document.body.appendChild(script);

        /*
         * Basic output example:
         * print("Hello")
         */

        setTimeout(() => {

            if (!outputBox.textContent) {
                outputBox.textContent =
                    "تم تشغيل الملف بدون Output.";
            }

        }, 100);

    } catch (error) {

        errorBox.textContent =
            "❌ " + error.message;

    }
}

</script>

</body>
</html>
