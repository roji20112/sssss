<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>wlanapp</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 50px;
  background-color: black;
  color: white;
}

/* اللوجو */
.logo {
  width: 180px;
  margin-bottom: 20px;
}

/* فورم */
input {
  padding: 10px;
  margin: 10px;
  width: 300px;
  background-color: #111;
  color: white;
  border: 1px solid #444;
}

button {
  padding: 10px;
  margin: 10px;
  width: 300px;
  background-color: #222;
  color: white;
  border: 1px solid #555;
  cursor: pointer;
}

button:hover {
  background-color: #444;
}

/* الفوتر */
.footer {
  position: fixed;
  bottom: 5px;
  width: 100%;
  text-align: center;
  font-size: 18px;
  color: #aaa;
  opacity: 0.8;
}
</style>

</head>
<body>

<!-- لوجو -->
<img src="IMG_6141.jpeg" class="logo">

<h2>fh_wlanapp</h2>

<input type="text" id="inputText" placeholder="fh_1234.">
<br>
<button onclick="transform()">تحويل</button>

<h3 id="output"></h3>

<!-- الفوتر -->
<footer class="footer">
  WEB BY DEVELOPER ROJI©️
</footer>

<script>
// قواعد التحويل
const rules = {
  "1": "e",
  "2": "d",
  "3": "c",
  "4": "b",
  "5": "a",
  "9": "6",
  "7": "8",
  "8": "7",
  "0": "f"
};

function transformText(text) {
  if (text.startsWith("fh_")) {
    text = text.substring(3);
  }

  let result = "";

  for (let ch of text) {
    result += rules[ch] || ch;
  }

  return "wlan" + result;
}

function transform() {
  let input = document.getElementById("inputText").value;
  let output = transformText(input);
  document.getElementById("output").innerText = output;
}
</script>

</body>
</html>
