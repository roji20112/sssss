<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Transformer</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 50px;
}
input, button {
  padding: 10px;
  margin: 10px;
  width: 300px;
}
</style>
</head>
<body>

<h2>fh_wlan wps app</h2>

<input type="text" id="inputText" placeholder="fh12345">
<br>
<button onclick="transform()">تحويل</button>

<h3 id="output"></h3>

<script>
// قواعد التحويل
const rules = {
  "1": "e",
  "9": "6",
  "4": "b",
  "2": "d",
  "7": "8",
  "8": "7"
};

function transformText(text) {
  if (text.startsWith("fh")) {
    text = text.substring(2);
  }

  let result = "";

  for (let ch of text) {
    result += rules[ch] || ch;
  }

  return "wlan" + result;
}

function transform() {
  let input = document.getElementById("inputText").value;
  let output = transformText(input);
  document.getElementById("output").innerText = output;
}
</script>

</body>
</html>
