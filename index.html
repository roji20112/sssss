<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Runner</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial;
        padding: 20px;
    }

    .box {
        max-width: 700px;
        margin: auto;
        background: #1c1c1c;
        padding: 20px;
        border-radius: 15px;
    }

    h1 {
        text-align: center;
    }

    input, button, textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 10px;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 16px;
    }

    button {
        background: #00c853;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    textarea {
        height: 250px;
        background: #000;
        color: #00ff66;
        font-family: monospace;
        direction: ltr;
    }

    #output {
        margin-top: 15px;
        background: #000;
        color: #00ff66;
        padding: 15px;
        border-radius: 10px;
        min-height: 100px;
        white-space: pre-wrap;
        direction: ltr;
        text-align: left;
    }
</style>
</head>

<body>

<div class="box">

<h1>🐍 Python Runner</h1>

<input type="file" id="file" accept=".py">

<button onclick="loadFile()">📂 فتح ملف Python</button>

<textarea id="code" placeholder="محتوى الملف سيظهر هنا..."></textarea>

<textarea id="reply" placeholder="اكتب الرد الذي تريد إرساله للبرنامج..."></textarea>

<button onclick="sendReply()">📤 إرسال الرد</button>

<div id="output">النتيجة ستظهر هنا...</div>

</div>

<script>

let pythonCode = "";

function loadFile() {

    const file = document.getElementById("file").files[0];

    if (!file) {
        alert("اختر ملف Python أولا");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        pythonCode = e.target.result;

        document.getElementById("code").value = pythonCode;

        document.getElementById("output").textContent =
            "✅ تم فتح الملف:\n\n" +
            pythonCode;
    };

    reader.readAsText(file);
}

function sendReply() {

    const reply = document.getElementById("reply").value;

    if (!reply) {
        alert("اكتب الرد أولا");
        return;
    }

    document.getElementById("output").textContent +=
        "\n\n📥 أنت: " + reply;

    document.getElementById("reply").value = "";
}

</script>

</body>
</html>
