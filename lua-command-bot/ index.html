<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua Command Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #181b22;
      border: 1px solid #292e38;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .upload {
      border: 2px dashed #3b82f6;
      border-radius: 16px;
      padding: 35px 15px;
      text-align: center;
      cursor: pointer;
      background: #12151b;
      transition: .2s;
    }

    .upload:hover {
      background: #171c25;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 15px;
      color: #60a5fa;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 25px;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      flex: 1;
      background: #11141a;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
      color: #60a5fa;
    }

    .commands {
      background: #0d1015;
      border-radius: 12px;
      padding: 15px;
      max-height: 350px;
      overflow-y: auto;
    }

    .command {
      background: #181c24;
      padding: 11px;
      border-radius: 8px;
      margin-bottom: 8px;
      direction: ltr;
      text-align: left;
      font-family: monospace;
    }

    .empty {
      text-align: center;
      color: #f59e0b;
      padding: 20px;
    }

    .download {
      background: #16a34a;
    }

    .download:hover {
      background: #15803d;
    }

    .warning {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #211c0d;
      color: #fbbf24;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 Lua Command Analyzer</h1>

    <div class="subtitle">
      ارفع ملف Lua لاستخراج الأوامر الموجودة داخله
    </div>

    <label class="upload" for="luaFile">
      <div class="upload-icon">📂</div>
      <div>اضغط هنا لاختيار ملف Lua</div>
      <div style="color:#9ca3af;margin-top:8px;">
        .lua فقط
      </div>

      <input id="luaFile" type="file" accept=".lua">
    </label>

    <div class="file-name" id="fileName"></div>

    <button id="analyzeBtn" disabled>
      🔍 تحليل الملف
    </button>

    <div class="result" id="result">

      <div class="stats">
        <div class="stat">
          <div>الأوامر</div>
          <div class="stat-number" id="commandCount">0</div>
        </div>

        <div class="stat">
          <div>الملف</div>
          <div style="font-size:14px;margin-top:8px;" id="resultFile">
            -
          </div>
        </div>
      </div>

      <div class="commands" id="commandsList"></div>

      <button class="download" id="downloadBtn">
        📥 تحميل الأوامر TXT
      </button>

    </div>

    <div class="warning">
      🔐 يتم تحليل محتوى الملف داخل المتصفح فقط ولا يتم تشغيل كود Lua.
    </div>

  </div>

<script>

const fileInput = document.getElementById("luaFile");
const analyzeBtn = document.getElementById("analyzeBtn");
const fileName = document.getElementById("fileName");

const result = document.getElementById("result");
const commandsList = document.getElementById("commandsList");
const commandCount = document.getElementById("commandCount");
const resultFile = document.getElementById("resultFile");
const downloadBtn = document.getElementById("downloadBtn");

let selectedFile = null;
let extractedCommands = [];

fileInput.addEventListener("change", function () {

  selectedFile = this.files[0];

  if (!selectedFile) {
    analyzeBtn.disabled = true;
    fileName.textContent = "";
    return;
  }

  if (!selectedFile.name.toLowerCase().endsWith(".lua")) {
    alert("❌ اختر ملف Lua فقط.");
    this.value = "";
    analyzeBtn.disabled = true;
    return;
  }

  selectedFile = this.files[0];

  fileName.textContent = "📄 " + selectedFile.name;

  analyzeBtn.disabled = false;
});


function extractCommands(code) {

  const commands = new Set();

  const patterns = [

    /["'](\/[\w-]+)["']/g,

    /\bcommand\s*=\s*["']([^"']+)["']/gi,

    /\bcmd\s*=\s*["']([^"']+)["']/gi,

    /[Cc]ommands?\s*\[\s*["']([^"']+)["']\s*\]/g,

    /[Rr]egisterCommand\s*\(\s*["']([^"']+)["']/g

  ];

  for (const pattern of patterns) {

    let match;

    while ((match = pattern.exec(code)) !== null) {

      let command = match[1].trim();

      if (command.startsWith("/")) {
        commands.add(command);
      }

    }

  }

  return Array.from(commands).sort();
}


analyzeBtn.addEventListener("click", async function () {

  if (!selectedFile) return;

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = "🔍 جاري التحليل...";

  try {

    const code = await selectedFile.text();

    extractedCommands = extractCommands(code);

    result.style.display = "block";

    commandCount.textContent = extractedCommands.length;

    resultFile.textContent = selectedFile.name;

    commandsList.innerHTML = "";

    if (extractedCommands.length === 0) {

      commandsList.innerHTML = `
        <div class="empty">
          ⚠️ لم يتم العثور على أوامر واضحة.
        </div>
      `;

    } else {

      extractedCommands.forEach((command, index) => {

        const div = document.createElement("div");

        div.className = "command";

        div.textContent = `${index + 1}. ${command}`;

        commandsList.appendChild(div);

      });

    }

  } catch (error) {

    alert("❌ حدث خطأ أثناء قراءة الملف.");

  }

  analyzeBtn.disabled = false;
  analyzeBtn.textContent = "🔍 تحليل الملف";

});


downloadBtn.addEventListener("click", function () {

  if (extractedCommands.length === 0) {
    alert("لا توجد أوامر لتحميلها.");
    return;
  }

  const content = extractedCommands.join("\n");

  const blob = new Blob(
    [content],
    { type: "text/plain;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "lua_commands.txt";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

});

</script>

</body>
</html>
